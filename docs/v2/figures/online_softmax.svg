<text x="40" y="857" font-size="22" font-weight="bold" style="fill:#152b4b">Per query row: m scalar · ℓ scalar · o has D elements → O(D) running state</text>
<text x="40" y="884" font-size="18" font-weight="normal" style="fill:#52647a">D = 16 or 64. Running-state size excludes KV storage, scratchpads and tile staging.</text>
<text x="40" y="910" font-size="18" font-weight="normal" style="fill:#52647a">Ideal formulas above. RTL: LUT / fixed-point arithmetic; raw weights feed ℓ, PV weights cap at 255.</text>
<text x="40" y="936" font-size="18" font-weight="normal" style="fill:#52647a">First tile ignores old output state. RTL final output: (o_int &lt;&lt; 8) / ℓ_int, with signed truncation.</text>
