<rect width="1200" height="965" fill="#ffffff"/>
<text x="40" y="52" font-size="36" font-weight="bold" style="fill:#152b4b">Online softmax · shared attention datapath</text>
<text x="40" y="86" font-size="22" font-weight="normal" style="fill:#52647a">Stream KV tiles · update per-query running state · normalize after the last tile</text>
<rect x="40" y="112" width="1120" height="54" rx="11" fill="#edf6fa" stroke="#9dbccb" stroke-width="1.4" />
<text x="600" y="145" text-anchor="middle" font-size="23" font-weight="bold" style="fill:#087e87">One shared 16 × 16 array (256 PEs) · QK and PV are scheduled phases</text>
<rect x="40" y="200" width="150" height="185" rx="11" fill="#eef7f2" stroke="#98bfa9" stroke-width="1.4" />
<text x="115" y="234" text-anchor="middle" font-size="23" font-weight="bold" style="fill:#152b4b">Input tile</text>
<text x="115" y="270" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#152b4b">Q : Bq × D</text>
<text x="115" y="299" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#152b4b">K : 16 × D</text>
<text x="115" y="328" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#152b4b">V : 16 × D</text>
<text x="115" y="363" text-anchor="middle" font-size="17" font-weight="normal" style="fill:#52647a">K/V from cache</text>
<rect x="230" y="200" width="170" height="185" rx="11" fill="#edf6fa" stroke="#9dbccb" stroke-width="1.4" />
<text x="315" y="235" text-anchor="middle" font-size="26" font-weight="bold" style="fill:#152b4b">1. QKᵀ</text>
<text x="315" y="266" text-anchor="middle" font-size="18" font-weight="normal" style="fill:#087e87">array phase 1</text>
<text x="315" y="306" text-anchor="middle" font-size="21" font-weight="normal" style="fill:#152b4b">signed INT8</text>
<text x="315" y="335" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#152b4b">→ INT32 scores</text>
<text x="315" y="365" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#52647a">Bq × 16</text>
<rect x="440" y="200" width="250" height="185" rx="11" fill="#fff4e2" stroke="#d9ad65" stroke-width="1.4" />
<text x="565" y="235" text-anchor="middle" font-size="23" font-weight="bold" style="fill:#152b4b">2. Scale + mask</text>
<text x="565" y="276" text-anchor="middle" font-size="19" font-weight="normal" style="fill:#152b4b">Q/K scales → dequantize</text>
<text x="565" y="306" text-anchor="middle" font-size="19" font-weight="normal" style="fill:#152b4b">Saturation → 1/√D shift</text>
<text x="565" y="344" text-anchor="middle" font-size="18" font-weight="normal" style="fill:#52647a">Key validity + causal mask</text>
<text x="565" y="369" text-anchor="middle" font-size="18" font-weight="normal" style="fill:#152b4b">s = eligible scaled scores</text>
<rect x="730" y="200" width="430" height="185" rx="11" fill="#fff0f2" stroke="#d5a9b4" stroke-width="1.4" />
<text x="945" y="232" text-anchor="middle" font-size="23" font-weight="bold" style="fill:#152b4b">3. Online update · per query row</text>
<text x="750" y="264" font-size="21" font-weight="normal" style="fill:#152b4b">m′ = max(m, max{sⱼ : j eligible})</text>
<text x="750" y="291" font-size="21" font-weight="normal" style="fill:#152b4b">α = exp(m − m′)</text>
<text x="750" y="318" font-size="20" font-weight="normal" style="fill:#152b4b">pⱼ = exp(sⱼ − m′); masked pⱼ = 0</text>
<text x="750" y="347" font-size="23" font-weight="normal" style="fill:#152b4b">ℓ′ = αℓ + Σⱼ pⱼ</text>
<text x="750" y="373" font-size="17" font-weight="normal" style="fill:#52647a">First tile: m′ = tile max; prior ℓ = 0</text>
<path class="data" d="M190 289 H230" data-route="shared-array"/>
<path class="data" d="M400 289 H440" data-route="score-mask"/>
<path class="data" d="M690 289 H730" data-route=""/>
<rect x="935" y="430" width="225" height="150" rx="11" fill="#edf6fa" stroke="#9dbccb" stroke-width="1.4" />
<text x="1048" y="463" text-anchor="middle" font-size="26" font-weight="bold" style="fill:#152b4b">4. PV</text>
<text x="1048" y="491" text-anchor="middle" font-size="19" font-weight="normal" style="fill:#087e87">same array · phase 2</text>
<text x="1048" y="522" text-anchor="middle" font-size="18" font-weight="normal" style="fill:#152b4b">unsigned P / signed V</text>
<text x="1048" y="553" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#152b4b">apply scale_v</text>
<rect x="580" y="430" width="315" height="150" rx="11" fill="#eef7f2" stroke="#98bfa9" stroke-width="1.4" />
<text x="737" y="464" text-anchor="middle" font-size="23" font-weight="bold" style="fill:#152b4b">5. Fused output update</text>
<text x="737" y="505" text-anchor="middle" font-size="29" font-weight="normal" style="fill:#152b4b">o′ = αo + P V</text>
<text x="737" y="539" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#152b4b">Rescale + accumulate</text>
<text x="737" y="565" text-anchor="middle" font-size="18" font-weight="normal" style="fill:#52647a">One buffer traversal</text>
<rect x="325" y="430" width="215" height="150" rx="11" fill="#f1effc" stroke="#bbb1d9" stroke-width="1.4" />
<text x="433" y="464" text-anchor="middle" font-size="25" font-weight="bold" style="fill:#152b4b">6. Normalize</text>
<text x="433" y="507" text-anchor="middle" font-size="29" font-weight="normal" style="fill:#152b4b">O = o / ℓ</text>
<text x="433" y="544" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#52647a">after last KV tile</text>
<rect x="40" y="430" width="245" height="150" rx="11" fill="#edf6fa" stroke="#9dbccb" stroke-width="1.4" />
<text x="162" y="466" text-anchor="middle" font-size="25" font-weight="bold" style="fill:#152b4b">Output tile</text>
<text x="162" y="505" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#152b4b">Bq × D · result buffer</text>
<text x="162" y="545" text-anchor="middle" font-size="20" font-weight="normal" style="fill:#52647a">Then SoC writeback</text>
<path class="data" d="M1048 385 V430" data-route="weights"/>
<text x="1063" y="415" font-size="21" font-weight="bold" style="fill:#087e87">P</text>
<path class="state" d="M790 385 V416 H737 V430" data-route="rescale"/>
<text x="800" y="414" font-size="20" font-weight="normal" style="fill:#52647a">α</text>
<path class="state" d="M750 385 V402 H433 V430" data-route="running-sum"/>
<text x="452" y="423" font-size="20" font-weight="normal" style="fill:#52647a">ℓ</text>
<path class="data" d="M935 505 H895" data-route="fused-output"/>
<path class="data" d="M580 505 H540" data-route="normalize"/>
<path class="data" d="M325 505 H285" data-route=""/>
<path class="data" d="M40 328 H20 V610 H1048 V580" data-route="values"/>
<text x="40" y="638" font-size="19" font-weight="bold" style="fill:#087e87">V from KV cache</text>
<text x="410" y="638" font-size="19" font-weight="normal" style="fill:#52647a">Repeat steps 1–5 per KV tile; step 6 runs only after the final tile.</text>
